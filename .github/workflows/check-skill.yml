name: Check skill

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skill structure
        run: bash scripts/check-skill.sh
      - name: Test skill checker
        run: bash scripts/tests/check-skill.test.sh
      - name: Test eval runner
        run: bash scripts/tests/eval-skill.test.sh
